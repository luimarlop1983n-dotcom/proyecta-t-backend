<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROYECTA+</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<div class="app"><header><div class="brand">PROYECTA<span>+</span></div><button id="logout" class="link hidden">Salir</button></header>
<section id="auth" class="auth"><div class="hero"><small>RADAR MULTIFUENTE</small><h1>Oportunidades públicas y culturales, filtradas para ti.</h1><p>Ministerio de Cultura, BOE y más fuentes, sin mezclar convocatorias con datos históricos.</p></div><div class="panel"><div class="tabs"><button class="tab active" data-mode="login">Entrar</button><button class="tab" data-mode="signup">Crear cuenta</button></div><input id="name" class="signup hidden" placeholder="Nombre"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña"><button id="authBtn" class="primary">Entrar</button><p id="msg" class="error"></p></div></section>
