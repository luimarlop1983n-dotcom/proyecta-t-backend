<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar contraseña · Proyecta-T</title><link rel="stylesheet" href="./styles.css"><script type="module" src="./recovery.js"></script></head><body><main class="shell"><header class="topbar"><a class="brand" href="/">Proyecta-T</a><a href="./index.html">Volver a entrar</a></header><form id="recovery" class="panel authPanel"><h1 id="recovery-title">Recupera tu acceso.</h1><p id="recovery-help">Te enviaremos un enlace para elegir una contraseña nueva.</p><div id="email-fields"><label for="recovery-email">Correo electrónico</label><input type="email" id="recovery-email" autocomplete="email" maxlength="320" required></div><div id="reset-fields" hidden><label for="new-password">Nueva contraseña</label><input type="password" id="new-password" autocomplete="new-password" minlength="8" maxlength="1024"><label for="confirm-password">Repite la nueva contraseña</label><input type="password" id="confirm-password" autocomplete="new-password" minlength="8" maxlength="1024"><button type="button" id="show-new" class="textbtn" aria-pressed="false">Mostrar contraseñas</button><p class="hint">Al menos 8 caracteres. Se cerrarán las sesiones anteriores.</p></div><button type="submit" id="recover-button" class="primary">Enviar enlace</button><p id="recovery-status" role="status" aria-live="polite"></p><a id="recovery-next" href="./index.html">Volver a entrar →</a></form></main></body></html>
